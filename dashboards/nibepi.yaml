# NibePi dashboard, generated by tools/gen_dashboard.py: do not edit.
# The entity ids are the defaults of a fresh install (device "Nibe F1255", S1).
# Better: Developer tools -> Actions -> nibepi.get_dashboard returns this
# dashboard with your entity ids. Paste either into Settings -> Dashboards ->
# Add dashboard -> menu -> Raw configuration editor. See the README.
title: NibePi
views:
  - title: Overview
    path: overview
    icon: "mdi:heat-pump"
    type: sections
    max_columns: 4
    badges:
      - type: entity
        entity: binary_sensor.nibe_f1255_gateway
        show_name: true
        name: Gateway
      - type: entity
        entity: sensor.nibe_f1255_prio
        show_name: true
        name: Priority
      - type: entity
        entity: sensor.nibe_f1255_compressor_frequency_actual
        show_name: true
        name: Compressor
      - type: entity
        entity: sensor.nibe_f1255_degree_minutes_16_bit
        show_name: true
        name: Degree minutes
      - type: entity
        entity: sensor.nibe_f1255_price_level
        show_name: true
        name: Price
      - type: entity
        entity: sensor.nibe_f1255_hot_water_planned_action
        show_name: true
        name: Hot water
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Climate
            heading_style: title
            icon: "mdi:home-thermometer"
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.nibe_f1255_gateway
                state: "off"
            card:
              type: markdown
              content: "<ha-alert alert-type=\"error\">The NibePi gateway is offline: nothing reaches the pump, which falls back to its own curve.</ha-alert>"
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nibe_f1255_lease_s1
                state: error
            card:
              type: markdown
              content: "<ha-alert alert-type=\"error\">Curve offset lease S1: the gateway reports an error.</ha-alert>"
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nibe_f1255_rmu40_room_temperature_lease_s1
                state: error
            card:
              type: markdown
              content: "<ha-alert alert-type=\"error\">RMU40 lease S1: the gateway reports an error.</ha-alert>"
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nibe_f1255_hot_water_comfort_mode_lease
                state: error
            card:
              type: markdown
              content: "<ha-alert alert-type=\"error\">Hot water comfort mode lease: the gateway reports an error.</ha-alert>"
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nibe_f1255_hot_water_period_lease
                state: error
            card:
              type: markdown
              content: "<ha-alert alert-type=\"error\">Hot water period lease: the gateway reports an error.</ha-alert>"
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nibe_f1255_temporary_lux_lease
                state: error
            card:
              type: markdown
              content: "<ha-alert alert-type=\"error\">Temporary lux lease: the gateway reports an error.</ha-alert>"
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.nibe_f1255_house_model_s1
                state:
                  - prior
                  - low
              - condition: state
                entity: select.nibe_f1255_heating_strategy_s1
                state: optimiser
            card:
              type: markdown
              content: "<ha-alert alert-type=\"info\">House model S1 has low confidence: the rules steer until the optimiser's model is good enough.</ha-alert>"
          - type: conditional
            conditions:
              - condition: state
                entity: switch.nibe_f1255_send_room_temperature_to_pump_rmu40_s1
                state: "on"
              - condition: state
                entity: sensor.nibe_f1255_rmu40_room_temperature_lease_s1
                state_not:
                  - active
                  - grace
            card:
              type: markdown
              content: "<ha-alert alert-type=\"warning\">RMU40 S1: the room temperature feed is on but its lease is not active.</ha-alert>"
          - type: tile
            entity: sensor.nibe_f1255_bt1_outdoor_temperature
            name: Outdoor
          - type: tile
            entity: sensor.nibe_f1255_bt50_room_temp_s1
            name: Indoor S1
          - type: tile
            entity: sensor.nibe_f1255_indoor_offset_s1
            name: Target S1
            state_content: setpoint
            icon: "mdi:target"
          - type: tile
            entity: sensor.nibe_f1255_planned_curve_offset_s1
            name: Planned offset S1
            state_content:
              - state
              - source
          - type: tile
            entity: sensor.nibe_f1255_pump_curve_offset_s1
            name: Pump offset S1
          - type: tile
            entity: select.nibe_f1255_heating_strategy_s1
            features:
              - type: select-options
            grid_options:
              columns: 12
          - type: tile
            entity: select.nibe_f1255_mode_s1
            features:
              - type: select-options
            grid_options:
              columns: 12
      - type: grid
        cards:
          - type: heading
            heading: Price and cost
            heading_style: title
            icon: "mdi:cash"
          - type: tile
            entity: sensor.nibe_f1255_price_level
          - type: tile
            entity: sensor.nibe_f1255_expected_savings_today
            name: Expected savings
          - type: tile
            entity: sensor.nibe_f1255_heat_pump_cost_today
            name: Heat pump cost
          - type: gauge
            entity: sensor.nibe_f1255_compressor_frequency_actual
            name: Compressor
            min: 0
            max: 120
            needle: true
          - type: tile
            entity: sensor.nibe_f1255_compr_in_power
            name: Compressor power
          - type: tile
            entity: sensor.nibe_f1255_degree_minutes_16_bit
            name: Degree minutes
      - type: grid
        cards:
          - type: heading
            heading: Hot water
            heading_style: title
            icon: "mdi:water-boiler"
          - type: tile
            entity: sensor.nibe_f1255_bt7_hw_top
            name: Hot water top (BT7)
          - type: tile
            entity: sensor.nibe_f1255_hot_water_planned_action
            name: Planned action
          - type: tile
            entity: sensor.nibe_f1255_hot_water_next_expected_draw
            name: Next draw
          - type: tile
            entity: sensor.nibe_f1255_hot_water_optimiser_plan
            name: Next optimised charge
          - type: tile
            entity: select.nibe_f1255_hot_water_mode
            features:
              - type: select-options
            grid_options:
              columns: 12
  - title: Heating
    path: heating
    icon: "mdi:radiator"
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Control S1
            heading_style: title
            icon: "mdi:tune"
          - type: tile
            entity: select.nibe_f1255_mode_s1
            features:
              - type: select-options
            grid_options:
              columns: 12
          - type: tile
            entity: select.nibe_f1255_heating_strategy_s1
            features:
              - type: select-options
            grid_options:
              columns: 12
          - type: tile
            entity: switch.nibe_f1255_indoor_control_s1
            name: Indoor
          - type: tile
            entity: switch.nibe_f1255_price_control_s1
            name: Price
          - type: tile
            entity: switch.nibe_f1255_forecast_control_s1
            name: Forecast
      - type: grid
        cards:
          - type: heading
            heading: Curve offset S1
            heading_style: title
            icon: "mdi:chart-bell-curve-cumulative"
          - type: markdown
            content: |-
              {%- set e = 'sensor.nibe_f1255_planned_curve_offset_s1' %}
              {%- set comps = state_attr(e, 'components') or {} %}
              {%- set reasons = state_attr(e, 'reasons') or {} %}
              {%- set total = state_attr(e, 'total') %}
              {%- set rules = state_attr(e, 'rules_total') %}
              **Planned offset {{ states(e) }}**: sum {{ total if total is not none else '-' }}, rules {{ rules if rules is not none else '-' }}, source {{ state_attr(e, 'source') or '-' }}
              {%- if state_attr(e, 'strategy_reason') %}

              *{{ state_attr(e, 'strategy_reason') }}*
              {%- endif %}
              {%- if state_attr(e, 'error') %}

              <ha-alert alert-type="error">{{ state_attr(e, 'error') }}</ha-alert>
              {%- endif %}

              | Component | Offset | Why |
              |:--|--:|:--|
              {%- for key, label in [('indoor', 'Indoor'), ('price', 'Price'), ('weather', 'Forecast')] %}
              | {{ label }} | {{ comps[key] if comps[key] is defined else '-' }} | {{ reasons[key] if reasons[key] is defined else '' }} |
              {%- endfor %}
            grid_options:
              columns: full
          - type: entities
            entities:
              - entity: sensor.nibe_f1255_planned_curve_offset_s1
                name: Planned
              - entity: sensor.nibe_f1255_pump_curve_offset_s1
                name: Pump (read back)
              - entity: sensor.nibe_f1255_indoor_offset_s1
                name: Indoor
              - entity: sensor.nibe_f1255_price_offset_s1
                name: Price
              - entity: sensor.nibe_f1255_forecast_offset_s1
                name: Forecast
              - type: attribute
                entity: sensor.nibe_f1255_indoor_offset_s1
                attribute: setpoint
                name: Setpoint
                suffix: "°C"
              - type: attribute
                entity: sensor.nibe_f1255_planned_curve_offset_s1
                attribute: base_adjust
                name: Base adjustment
      - type: grid
        cards:
          - type: heading
            heading: Optimiser plan S1
            heading_style: title
            icon: "mdi:chart-timeline-variant-shimmer"
          - type: tile
            entity: sensor.nibe_f1255_optimiser_plan_s1
            name: Planned offset now
            state_content:
              - state
              - strategy
          - type: markdown
            content: |-
              {%- set e = 'sensor.nibe_f1255_optimiser_plan_s1' %}
              {%- set rows = state_attr(e, 'plan_24h') or [] %}
              {%- set lines = state_attr(e, 'explanation') or [] %}
              {%- set gate = state_attr(e, 'gate') or {} %}
              {%- if state_attr(e, 'problem') %}
              <ha-alert alert-type="warning">{{ state_attr(e, 'problem') }}</ha-alert>

              {% endif %}
              {{- state_attr(e, 'summary') or 'No plan yet.' }}
              {%- if gate.reason is defined %}

              Gate: {{ 'optimiser steers' if gate.use else 'rules steer' }} ({{ gate.reason }}){{ ', applied' if state_attr(e, 'applied') else ', not applied' }}.
              {%- endif %}
              {%- if lines %}
              {% for line in lines %}
              - {{ line }}
              {%- endfor %}
              {%- endif %}
              {%- if rows %}

              | Time | Offset | Indoor |
              |:--|--:|--:|
              {%- set ns = namespace(hours=0) %}
              {%- for r in rows %}
              {%- if r[0][-2:] == '00' %}{% set ns.hours = ns.hours + 1 %}{% endif %}
              {%- if ns.hours <= 12 %}
              | {{ r[0] }} | {{ '%+d' | format(r[1] | int) }} | {{ r[2] }} °C |
              {%- endif %}
              {%- endfor %}
              {%- endif %}
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: House model S1
            heading_style: title
            icon: "mdi:home-analytics"
          - type: tile
            entity: sensor.nibe_f1255_house_model_s1
            name: Confidence
            state_content:
              - state
              - confidence
          - type: entities
            entities:
              - type: attribute
                entity: sensor.nibe_f1255_house_model_s1
                attribute: heat_loss_w_per_k
                name: Heat loss
                suffix: W/K
              - type: attribute
                entity: sensor.nibe_f1255_house_model_s1
                attribute: time_constant_h
                name: Time constant
                suffix: h
              - type: attribute
                entity: sensor.nibe_f1255_house_model_s1
                attribute: capacity_kwh_per_k
                name: Heat capacity
                suffix: kWh/K
              - type: attribute
                entity: sensor.nibe_f1255_house_model_s1
                attribute: emitter
                name: Emitters
              - type: attribute
                entity: sensor.nibe_f1255_house_model_s1
                attribute: emitter_lag_h
                name: Emitter lag
                suffix: h
              - type: attribute
                entity: sensor.nibe_f1255_house_model_s1
                attribute: slab_temperature
                name: Slab now
                suffix: "°C"
              - type: attribute
                entity: sensor.nibe_f1255_house_model_s1
                attribute: sim_rmse
                name: Fit error (RMSE)
                suffix: "°C"
              - type: attribute
                entity: sensor.nibe_f1255_house_model_s1
                attribute: data_hours
                name: Data
                suffix: h
              - type: attribute
                entity: sensor.nibe_f1255_house_model_s1
                attribute: last_fit
                name: Last fit
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: History S1
            heading_style: title
            icon: "mdi:chart-line"
          - type: history-graph
            title: Indoor and outdoor
            hours_to_show: 24
            entities:
              - entity: sensor.nibe_f1255_bt50_room_temp_s1
                name: Indoor
              - entity: sensor.nibe_f1255_bt1_outdoor_temperature
                name: Outdoor
            grid_options:
              columns: full
          - type: history-graph
            title: Curve offset
            hours_to_show: 24
            entities:
              - entity: sensor.nibe_f1255_planned_curve_offset_s1
                name: Planned
              - entity: sensor.nibe_f1255_pump_curve_offset_s1
                name: Pump
              - entity: sensor.nibe_f1255_optimiser_plan_s1
                name: Optimiser
            grid_options:
              columns: full
          - type: history-graph
            title: Supply and return
            hours_to_show: 24
            entities:
              - entity: sensor.nibe_f1255_bt2_supply_temp_s1
                name: Supply (BT2)
              - entity: sensor.nibe_f1255_eb100_ep14_bt3_return_temp
                name: Return (BT3)
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Cost
            heading_style: title
            icon: "mdi:cash-multiple"
          - type: tile
            entity: sensor.nibe_f1255_heat_pump_cost_today
            name: Heat pump cost today
          - type: tile
            entity: sensor.nibe_f1255_expected_savings_today
            name: Expected savings today
          - type: statistics-graph
            title: Cost per day
            entities:
              - sensor.nibe_f1255_heat_pump_cost_today
              - sensor.nibe_f1255_expected_savings_today
            stat_types:
              - change
            chart_type: bar
            period: day
            days_to_show: 30
            grid_options:
              columns: full
  - title: Hot water
    path: hot-water
    icon: "mdi:water-boiler"
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Control
            heading_style: title
            icon: "mdi:water-boiler-auto"
          - type: tile
            entity: select.nibe_f1255_hot_water_mode
            features:
              - type: select-options
            grid_options:
              columns: 12
          - type: tile
            entity: switch.nibe_f1255_hot_water_vv_ai_control
          - type: tile
            entity: switch.nibe_f1255_optimise_hot_water_charges
          - type: tile
            entity: switch.nibe_f1255_hot_water_learning
          - type: tile
            entity: switch.nibe_f1255_hot_water_automatic_luxury
          - type: tile
            entity: switch.nibe_f1255_hot_water_priority
          - type: tile
            entity: switch.nibe_f1255_hot_water_comfort_mode_by_price
      - type: grid
        cards:
          - type: heading
            heading: Now
            heading_style: title
            icon: "mdi:water-boiler"
          - type: tile
            entity: sensor.nibe_f1255_bt7_hw_top
            name: Top (BT7)
          - type: tile
            entity: sensor.nibe_f1255_bt6_hw_load
            name: Load (BT6)
          - type: tile
            entity: sensor.nibe_f1255_hot_water_planned_action
            name: Planned action
          - type: markdown
            content: |-
              {%- set e = 'sensor.nibe_f1255_hot_water_planned_action' %}
              {%- set reasons = state_attr(e, 'reasons') or {} %}
              {%- set nxt = state_attr(e, 'next_heat_start') %}
              {%- set closed = state_attr(e, 'closed_until') %}
              **{{ states(e) | replace('_', ' ') | capitalize }}** (mode {{ state_attr(e, 'mode') or '-' }})
              {%- if state_attr(e, 'error') %}

              <ha-alert alert-type="error">{{ state_attr(e, 'error') }}</ha-alert>
              {%- endif %}

              Next heating: {{ as_timestamp(nxt) | timestamp_custom('%a %H:%M') if nxt else '-' }}
              {%- if closed %} · closed until {{ as_timestamp(closed) | timestamp_custom('%a %H:%M') }}{% endif %}
              {%- if reasons %}

              | Feature | Reason |
              |:--|:--|
              {%- for key, text in reasons.items() %}
              | {{ key | replace('_', ' ') | capitalize }} | {{ text }} |
              {%- endfor %}
              {%- endif %}
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Draws
            heading_style: title
            icon: "mdi:shower-head"
          - type: tile
            entity: sensor.nibe_f1255_hot_water_next_expected_draw
            name: Next expected draw
          - type: entities
            entities:
              - type: attribute
                entity: sensor.nibe_f1255_hot_water_next_expected_draw
                attribute: confidence
                name: Confidence
              - type: attribute
                entity: sensor.nibe_f1255_hot_water_next_expected_draw
                attribute: expected_drop
                name: Expected drop
                suffix: "°C"
              - type: attribute
                entity: sensor.nibe_f1255_hot_water_next_expected_draw
                attribute: slot
                name: Slot
              - type: attribute
                entity: sensor.nibe_f1255_hot_water_next_expected_draw
                attribute: learned_draws
                name: Learned draws
              - type: attribute
                entity: sensor.nibe_f1255_hot_water_next_expected_draw
                attribute: last_learned
                name: Last learned
      - type: grid
        cards:
          - type: heading
            heading: "Plan, next 24 h"
            heading_style: title
            icon: "mdi:calendar-clock"
          - type: markdown
            title: VV-AI windows
            content: |-
              {%- set windows = state_attr('sensor.nibe_f1255_hot_water_planned_action', 'plan_24h') or [] %}
              {%- if windows %}
              | Window | Peak | Mode | Target |
              |:--|:--|:--|--:|
              {%- for w in windows %}
              | {{ (w.start or '')[11:16] }}-{{ (w.end or '')[11:16] }} | {{ (w.peak or '')[11:16] }} | {{ w.mode or '-' }} | {{ w.target if w.target is not none else '-' }} |
              {%- endfor %}
              {%- else %}
              No VV-AI heating windows in the next 24 h.
              {%- endif %}
            grid_options:
              columns: full
          - type: tile
            entity: sensor.nibe_f1255_hot_water_optimiser_plan
            name: Next optimised charge
          - type: markdown
            title: Optimiser charges
            content: |-
              {%- set e = 'sensor.nibe_f1255_hot_water_optimiser_plan' %}
              {%- set blocks = state_attr(e, 'blocks') or [] %}
              {%- set saved = state_attr(e, 'savings') %}
              {%- if state_attr(e, 'problem') %}
              <ha-alert alert-type="warning">{{ state_attr(e, 'problem') }}</ha-alert>

              {% endif %}
              {{- 'In use' if state_attr(e, 'in_use') else ('Enabled, not in use' if state_attr(e, 'enabled') else 'Off (shown for comparison)') }}
              {%- if saved is not none %}: saves {{ saved }} {{ state_attr(e, 'currency') or '' }} against the baseline, tank min {{ state_attr(e, 'min_temp') }} °C{% endif %}.
              {%- if blocks %}

              | Time | Action | Target | Why |
              |:--|:--|--:|:--|
              {%- for b in blocks %}
              | {{ b.start }}-{{ b.end }} | {{ b.action }}{{ ' (boost)' if b.boost else '' }} | {{ b.target if b.target is not none else '-' }} | {{ b.reason or '' }} |
              {%- endfor %}
              {%- endif %}
            grid_options:
              columns: full
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: History
            heading_style: title
            icon: "mdi:chart-line"
          - type: history-graph
            title: Tank
            hours_to_show: 48
            entities:
              - entity: sensor.nibe_f1255_bt7_hw_top
                name: Top (BT7)
              - entity: sensor.nibe_f1255_bt6_hw_load
                name: Load (BT6)
            grid_options:
              columns: full
          - type: history-graph
            title: Actions
            hours_to_show: 48
            entities:
              - entity: sensor.nibe_f1255_hot_water_planned_action
                name: Planned action
              - entity: sensor.nibe_f1255_prio
                name: Priority
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Leases
            heading_style: title
            icon: "mdi:lock-clock"
          - type: tile
            entity: sensor.nibe_f1255_hot_water_comfort_mode_lease
            name: Comfort mode (47041)
          - type: tile
            entity: sensor.nibe_f1255_hot_water_period_lease
            name: Period (47134)
          - type: tile
            entity: sensor.nibe_f1255_temporary_lux_lease
            name: Temporary lux (48132)
  - title: Gateway and safety
    path: gateway
    icon: "mdi:shield-check"
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Gateway
            heading_style: title
            icon: "mdi:router-network"
          - type: tile
            entity: binary_sensor.nibe_f1255_gateway
            name: Gateway
          - type: entities
            entities:
              - type: attribute
                entity: binary_sensor.nibe_f1255_gateway
                attribute: version
                name: Version
              - type: attribute
                entity: binary_sensor.nibe_f1255_gateway
                attribute: core
                name: Core
              - type: attribute
                entity: binary_sensor.nibe_f1255_gateway
                attribute: raw_set
                name: Raw writes
              - type: attribute
                entity: binary_sensor.nibe_f1255_gateway
                attribute: last_data
                name: Last data
              - type: attribute
                entity: binary_sensor.nibe_f1255_gateway
                attribute: last_message_at
                name: Last message
              - type: attribute
                entity: binary_sensor.nibe_f1255_gateway
                attribute: last_status
                name: Status
              - type: attribute
                entity: binary_sensor.nibe_f1255_gateway
                attribute: status_topic
                name: Status topic
      - type: grid
        cards:
          - type: heading
            heading: Leases
            heading_style: title
            icon: "mdi:lock-clock"
          - type: markdown
            content: |-
              | Lease | State | Value | Expires | Error |
              |:--|:--|--:|:--|:--|
              {%- for name, e in [('Curve offset S1', 'sensor.nibe_f1255_lease_s1'), ('RMU40 S1', 'sensor.nibe_f1255_rmu40_room_temperature_lease_s1'), ('Hot water comfort mode', 'sensor.nibe_f1255_hot_water_comfort_mode_lease'), ('Hot water period', 'sensor.nibe_f1255_hot_water_period_lease'), ('Temporary lux', 'sensor.nibe_f1255_temporary_lux_lease')] %}
              {%- set value = state_attr(e, 'value') %}
              {%- set exp = state_attr(e, 'expires') %}
              | {{ name }} | {{ states(e) }} | {{ value if value is not none else '-' }} | {{ as_timestamp(exp) | timestamp_custom('%H:%M:%S') if exp else '-' }} | {{ state_attr(e, 'error') or '' }} |
              {%- endfor %}
            grid_options:
              columns: full
          - type: tile
            entity: sensor.nibe_f1255_lease_s1
            name: Curve offset S1
          - type: tile
            entity: sensor.nibe_f1255_rmu40_room_temperature_lease_s1
            name: RMU40 S1
          - type: tile
            entity: sensor.nibe_f1255_hot_water_comfort_mode_lease
            name: Hot water comfort mode
          - type: tile
            entity: sensor.nibe_f1255_hot_water_period_lease
            name: Hot water period
          - type: tile
            entity: sensor.nibe_f1255_temporary_lux_lease
            name: Temporary lux
