# OPTIONAL: needs the apexcharts-card from HACS (not built in).
# The optimiser's planned offset and predicted indoor temperature for the
# next 24 h, with the price level. Generated by tools/gen_dashboard.py: do
# not edit. nibepi.get_dashboard returns it with your entity ids as
# apexcharts_yaml.
title: NibePi charts
views:
  - title: Optimiser chart
    path: optimiser-chart
    icon: "mdi:chart-timeline-variant-shimmer"
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Optimiser plan
            heading_style: title
            icon: "mdi:chart-timeline-variant-shimmer"
          - type: "custom:apexcharts-card"
            header:
              show: true
              title: "Optimiser plan S1, next 24 h"
            graph_span: "24h"
            span:
              start: minute
            now:
              show: true
              label: Now
            yaxis:
              - id: offset
                decimals: 0
                min: -10
                max: 10
              - id: temp
                opposite: true
                decimals: 1
              - id: price
                show: false
                min: 0
                max: 5
            series:
              - entity: sensor.nibe_f1255_optimiser_plan_s1
                name: Planned offset
                yaxis_id: offset
                type: line
                curve: stepline
                data_generator: |-
                  // plan_24h rows are [local "HH:MM", offset, predicted indoor °C].
                  const rows = entity.attributes.plan_24h || [];
                  const now = new Date();
                  let prev = null;
                  return rows.map((r) => {
                    const [h, m] = r[0].split(':').map(Number);
                    let t = new Date(now);
                    t.setHours(h, m, 0, 0);
                    if (prev === null && t - now > 12 * 3600e3) t = new Date(t.getTime() - 86400e3);
                    while (prev !== null && t <= prev) t = new Date(t.getTime() + 86400e3);
                    prev = t;
                    return [t.getTime(), r[1]];
                  });
              - entity: sensor.nibe_f1255_optimiser_plan_s1
                name: Predicted indoor
                yaxis_id: temp
                type: line
                curve: smooth
                data_generator: |-
                  // plan_24h rows are [local "HH:MM", offset, predicted indoor °C].
                  const rows = entity.attributes.plan_24h || [];
                  const now = new Date();
                  let prev = null;
                  return rows.map((r) => {
                    const [h, m] = r[0].split(':').map(Number);
                    let t = new Date(now);
                    t.setHours(h, m, 0, 0);
                    if (prev === null && t - now > 12 * 3600e3) t = new Date(t.getTime() - 86400e3);
                    while (prev !== null && t <= prev) t = new Date(t.getTime() + 86400e3);
                    prev = t;
                    return [t.getTime(), r[2]];
                  });
              - entity: sensor.nibe_f1255_price_level
                name: Price level
                yaxis_id: price
                type: column
                opacity: 0.3
                data_generator: |-
                  // levels: {ISO hour: level}; 1 very cheap ... 5 very expensive.
                  const rank = {VERY_CHEAP: 1, CHEAP: 2, NORMAL: 3, EXPENSIVE: 4, VERY_EXPENSIVE: 5};
                  const levels = entity.attributes.levels || {};
                  return Object.entries(levels).map(([t, l]) => [new Date(t).getTime(), rank[l] || null]);
            grid_options:
              columns: full
